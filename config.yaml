app:
  name: "VoiceDeck"
  version: "1.1.0"
  language: "en"
  panic_hotkey: "ctrl+shift+m"

audio:
  device_index: null # null = system default microphone
  sample_rate: 16000 # Vosk recommended 16kHz
  chunk_size: 4000   # ~0.25 seconds per chunk
  silence_threshold_rms: 0.015 # Minimum energy to process

context_biasing:
  enabled: true # Dynamically adapts ASR grammar to the words on the active slide (Lexical RAG)
  auto_highlight: false # If true, automatically highlights slide terms when spoken
  min_term_length: 3

control:
  debounce_seconds: 1.2 # Cooldown between slide triggers
  keywords:
    next:
      - "next"
      - "next slide"
      - "lanjut"
      - "berikutnya"
      - "maju"
    previous:
      - "previous"
      - "back"
      - "kembali"
      - "mundur"
      - "sebelumnya"
    highlight:
      - "highlight"
      - "sorot"
      - "tandai"
      - "garis bawahi"

overlay:
  enabled: true
  auto_fade_seconds: 4.0
  highlight_color: "#FFE50088"
  underline_color: "#EAB308"
  border_radius: 6
